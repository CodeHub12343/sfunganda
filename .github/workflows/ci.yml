name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — lint · typecheck · test · build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://ci.example.com
      INTERNAL_PROXY_SECRET: ci-internal-proxy-secret
      API_ORIGIN: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  api:
    name: API — lint · typecheck · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: Smoke E2E
    needs: [web, api]
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      STRIPE_SECRET_KEY_TEST: sk_test_dummy_ci
      INTERNAL_PROXY_SECRET: ci-internal-proxy-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run test:e2e:install
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  admin-a11y:
    # Milestone 6 — axe-core gate for the admin mobile shell. Blocks the
    # full flag flip. The suite is skipped when the signed-in session
    # cookie secret is not set (fork PRs can't see secrets), so this job
    # only "soft-fails" on forks: the step runs and the suite reports
    # all specs skipped. On the main repository the secret is injected
    # and axe-serious/critical violations fail the build.
    name: Admin a11y — axe-core
    needs: [web, api]
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      STRIPE_SECRET_KEY_TEST: sk_test_dummy_ci
      INTERNAL_PROXY_SECRET: ci-internal-proxy-secret
      ADMIN_A11Y_SESSION_COOKIE: ${{ secrets.ADMIN_A11Y_SESSION_COOKIE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run test:e2e:install
      - run: npx playwright test tests/e2e/admin-a11y.spec.ts --project=chromium
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-a11y-report
          path: playwright-report
          retention-days: 14
